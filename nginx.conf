server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # บีบอัดข้อความก่อนส่ง (html/css/js/svg)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # endpoint สำหรับ HEALTHCHECK / load balancer
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # HTML — ไม่แคช เพื่อให้เนื้อหาอัปเดตถึงผู้ใช้ทันที
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # รูปภาพ — แคช 7 วัน (เปลี่ยนชื่อไฟล์เมื่ออัปเดตรูป เพื่อไม่ให้ผู้ใช้เห็นของเก่า)
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
}
